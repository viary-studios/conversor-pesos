<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Monedas a Peso Chileno</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Google Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
        }
        /* Ocultar las flechas del input numérico */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-800">

    <div class="glass-card w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-white/50">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold mb-1">Conversor de Divisas</h1>
            <p class="text-blue-100 text-sm">Latinoamérica & USD ↔ CLP</p>
        </div>

        <!-- Body -->
        <div class="p-6">
            <!-- Loading Indicator -->
            <div id="loading" class="text-center text-sm text-blue-600 mb-4 font-medium animate-pulse">
                Actualizando tasas de cambio en vivo...
            </div>

            <!-- Amount Input -->
            <div class="mb-5">
                <label for="amount" class="block text-sm font-semibold text-slate-600 mb-2">Monto a convertir</label>
                <div class="relative">
                    <input type="number" id="amount" value="1000" min="0" step="any"
                        class="w-full pl-4 pr-4 py-3 text-2xl font-bold text-slate-800 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>
            </div>

            <!-- Currency Selection -->
            <div class="flex items-center justify-between gap-3 relative mb-6">
                <!-- From -->
                <div class="w-full">
                    <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">De</label>
                    <select id="currency-from" class="w-full appearance-none bg-slate-50 border border-slate-200 text-slate-700 py-3 pl-3 pr-8 rounded-xl font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer">
                        <option value="CLP">🇨🇱 Peso Chileno (CLP)</option>
                        <option value="MXN" selected>🇲🇽 Peso Mexicano (MXN)</option>
                        <option value="PEN">🇵🇪 Sol Peruano (PEN)</option>
                        <option value="ARS">🇦🇷 Peso Argentino (ARS)</option>
                        <option value="USD">🇺🇸 Dólar (USD)</option>
                    </select>
                </div>

                <!-- Swap Button -->
                <div class="absolute left-1/2 top-[60%] -translate-x-1/2 -translate-y-1/2 z-10">
                    <button id="swap-btn" class="bg-blue-600 text-white p-2 rounded-full shadow-lg hover:bg-blue-700 hover:scale-110 hover:rotate-180 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500" title="Invertir monedas">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16 3h5v5"/><path d="M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3"/><path d="m15 9 6-6"/>
                            <path d="M21 21v-5h-5"/><path d="M3 21v-5h5"/><path d="M12 2v8.3a4 4 0 0 0 1.172 2.872L21 21"/><path d="m9 15-6 6"/>
                        </svg>
                    </button>
                </div>

                <!-- To -->
                <div class="w-full">
                    <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider text-right">A</label>
                    <select id="currency-to" class="w-full appearance-none bg-slate-50 border border-slate-200 text-slate-700 py-3 pl-3 pr-8 rounded-xl font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all cursor-pointer" dir="rtl">
                        <option value="CLP" selected>🇨🇱 Peso Chileno (CLP)</option>
                        <option value="MXN">🇲🇽 Peso Mexicano (MXN)</option>
                        <option value="PEN">🇵🇪 Sol Peruano (PEN)</option>
                        <option value="ARS">🇦🇷 Peso Argentino (ARS)</option>
                        <option value="USD">🇺🇸 Dólar (USD)</option>
                    </select>
                </div>
            </div>

            <!-- Result Section -->
            <div class="bg-blue-50 rounded-2xl p-5 text-center border border-blue-100">
                <p id="rate-info" class="text-sm text-slate-500 font-medium mb-2">Calculando...</p>
                <div id="result-display" class="text-4xl font-bold text-blue-700 break-words">0.00</div>
            </div>
            
            <p class="text-xs text-center text-slate-400 mt-4">
                * Las tasas mostradas son referenciales y pueden variar respecto a tu banco o casa de cambio.
            </p>
        </div>
    </div>

    <script>
        // DOM Elements
        const amountInput = document.getElementById('amount');
        const fromSelect = document.getElementById('currency-from');
        const toSelect = document.getElementById('currency-to');
        const swapBtn = document.getElementById('swap-btn');
        const resultDisplay = document.getElementById('result-display');
        const rateInfo = document.getElementById('rate-info');
        const loadingIndicator = document.getElementById('loading');

        // Formatos de moneda nativos para cada país
        const formatters = {
            CLP: new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', minimumFractionDigits: 0 }),
            MXN: new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }),
            PEN: new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }),
            ARS: new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }),
            USD: new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' })
        };

        // Tasas de respaldo (fallback por si falla la API, basadas en USD como base = 1)
        // Valores aproximados.
        let exchangeRates = {
            USD: 1,
            CLP: 945.50,
            MXN: 16.80,
            PEN: 3.75,
            ARS: 880.00 
        };

        // Fetch Live Rates
        async function fetchLiveRates() {
            try {
                // API pública gratuita Open Exchange Rates compatible
                const response = await fetch('https://open.er-api.com/v6/latest/USD');
                if (!response.ok) throw new Error('API no respondió correctamente');
                
                const data = await response.json();
                
                // Actualizar nuestras tasas con la data en vivo
                exchangeRates.CLP = data.rates.CLP;
                exchangeRates.MXN = data.rates.MXN;
                exchangeRates.PEN = data.rates.PEN;
                exchangeRates.ARS = data.rates.ARS; // Nota: ARS en APIs suele ser el oficial.

                loadingIndicator.style.display = 'none';
            } catch (error) {
                console.warn('Error al obtener tasas en vivo, usando tasas de respaldo locales:', error);
                loadingIndicator.textContent = 'Usando tasas de cambio de respaldo';
                loadingIndicator.classList.remove('animate-pulse', 'text-blue-600');
                loadingIndicator.classList.add('text-amber-500');
                setTimeout(() => { loadingIndicator.style.display = 'none'; }, 3000);
            }
            calculate();
        }

        // Logic de Conversión
        function calculate() {
            const amount = parseFloat(amountInput.value) || 0;
            const from = fromSelect.value;
            const to = toSelect.value;

            // Fórmula: (Monto / Tasa Moneda Origen) * Tasa Moneda Destino
            // Ejemplo: 100 MXN a CLP.  (100 / 16.8) * 945.5 = ~ 5627 CLP
            const valueInUSD = amount / exchangeRates[from];
            const convertedAmount = valueInUSD * exchangeRates[to];
            
            // Mostrar Resultado
            resultDisplay.textContent = formatters[to].format(convertedAmount);

            // Calcular tasa unitaria para mostrar abajo (1 FROM = X TO)
            const unitRate = (1 / exchangeRates[from]) * exchangeRates[to];
            
            // Formatear tasa unitaria
            let formattedUnitRate = new Intl.NumberFormat('es-CL', { 
                minimumFractionDigits: 2, 
                maximumFractionDigits: 4 
            }).format(unitRate);

            rateInfo.textContent = `1 ${from} = ${formattedUnitRate} ${to}`;
        }

        // Intercambiar Monedas
        function swapCurrencies() {
            const temp = fromSelect.value;
            fromSelect.value = toSelect.value;
            toSelect.value = temp;
            calculate();
        }

        // Event Listeners
        amountInput.addEventListener('input', calculate);
        fromSelect.addEventListener('change', calculate);
        toSelect.addEventListener('change', calculate);
        swapBtn.addEventListener('click', swapCurrencies);

        // Inicializar
        fetchLiveRates();
    </script>
</body>
</html>
